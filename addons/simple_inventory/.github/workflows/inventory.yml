name: Inventory validation
on:
  pull_request:
  push:
    branches: [master, 'integrate/**']
permissions:
  contents: read
jobs:
  contracts:
    name: Inventory contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Godot 4.7.2
        run: |
          curl --fail --location --retry 3 -o /tmp/godot.zip https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.7.2-stable_linux.x86_64
      - name: Validate inventory
        run: python tools/run_tests.py --godot /tmp/godot/Godot_v4.7.2-stable_linux.x86_64
